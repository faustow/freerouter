version: '3.8'

services:
  freerouter:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: freerouter
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./evaluation_results:/app/evaluation_results
      - ./configs:/app/configs
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: poetry run freerouter ask "Hello from Docker!"
    
  freerouter-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: freerouter-dev
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - freerouter-cache:/app/.cache
    ports:
      - "8000:8000"
      - "8001:8001"  # For development server
    restart: unless-stopped
    command: /bin/bash
    stdin_open: true
    tty: true

volumes:
  freerouter-cache: