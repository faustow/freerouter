# Evaluation configuration for FreeRouter
# Defines how models are benchmarked and evaluated

evaluation_settings:
  # How often to run full evaluation (in hours)
  evaluation_interval: 24
  
  # Minimum number of test queries per category
  min_queries_per_category: 10
  
  # Timeout for individual model responses (seconds)
  response_timeout: 30
  
  # Number of concurrent evaluations
  concurrent_evaluations: 3

# Test query categories and samples
test_queries:
  coding:
    - "Write a Python function to calculate factorial"
    - "How do I reverse a string in JavaScript?"
    - "Implement a binary search algorithm"
    - "Debug this SQL query: SELECT * FROM users WHERE"
    - "Create a REST API endpoint in Flask"
    - "Write a function to find prime numbers"
    - "How to handle exceptions in Python?"
    - "Implement quicksort algorithm"
    - "Create a class for a simple calculator"
    - "Write regex to validate email addresses"
    
  creative_writing:
    - "Write a short story about a time traveler"
    - "Create a poem about the ocean"
    - "Describe a futuristic city"
    - "Write dialogue between two characters meeting for the first time"
    - "Create a mystery story opening"
    - "Write a letter from the future"
    - "Describe a magical forest"
    - "Create a character backstory for a detective"
    - "Write a haiku about technology"
    - "Describe a cooking recipe as an adventure"
    
  analysis:
    - "Compare renewable energy sources"
    - "Analyze the pros and cons of remote work"
    - "Evaluate different programming languages for web development"
    - "Compare electric vs gas vehicles"
    - "Analyze the impact of social media on society"
    - "Evaluate cloud computing providers"
    - "Compare investment strategies"
    - "Analyze market trends in AI"
    - "Evaluate database management systems"
    - "Compare different learning methodologies"
    
  math:
    - "Solve: 2x + 5 = 15"
    - "Calculate the area of a circle with radius 7"
    - "Find the derivative of x^2 + 3x + 2"
    - "What is 15% of 240?"
    - "Solve the quadratic equation x^2 - 4x + 3 = 0"
    - "Calculate compound interest for 5 years at 4%"
    - "Find the mean and median of [1, 3, 5, 7, 9, 11]"
    - "Convert 75 degrees Fahrenheit to Celsius"
    - "Calculate the volume of a sphere with radius 3"
    - "Solve: log(x) = 2"
    
  reasoning:
    - "If all birds can fly and penguins are birds, why can't penguins fly?"
    - "Explain the paradox: Can an omnipotent being create a stone they cannot lift?"
    - "A man lives on the 20th floor. Every morning he takes the elevator down. When he comes home, he takes the elevator to the 10th floor and walks the rest, except on rainy days. Why?"
    - "Why are manhole covers round?"
    - "How would you measure the height of a building using a barometer?"
    - "If you had to choose between saving one person you love or five strangers, what would you do and why?"
    - "Explain why correlation doesn't imply causation with an example"
    - "What happens when an unstoppable force meets an immovable object?"
    - "How do you know if you're living in a simulation?"
    - "Why is there something rather than nothing?"

# Scoring criteria
scoring_criteria:
  accuracy:
    weight: 0.3
    description: "How correct and factual is the response?"
    
  relevance:
    weight: 0.25
    description: "How well does the response address the query?"
    
  clarity:
    weight: 0.2
    description: "How clear and understandable is the response?"
    
  completeness:
    weight: 0.15
    description: "How complete is the response?"
    
  efficiency:
    weight: 0.1
    description: "Response time and resource usage"

# Evaluation thresholds
thresholds:
  excellent: 4.5
  good: 3.5
  acceptable: 2.5
  poor: 1.5